# ==============================================================================
# AQUA CREW — Mosquitto MQTT Broker Configuration (Task 20)
# Edge IoT Sensor Telemetry & Virtual Rover Event Broker
# ==============================================================================

# Standard unencrypted MQTT listener for internal Docker network
listener 1883 0.0.0.0

# WebSocket listener for browser-based telemetry streaming
listener 9001 0.0.0.0
protocol websockets

# Persistence configuration
persistence true
persistence_location /mosquitto/data/
autosave_interval 1800

# Logging configuration
log_dest stdout
log_dest file /mosquitto/log/mosquitto.log
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
log_timestamp true
log_timestamp_format %Y-%m-%dT%H:%M:%S

# Security & Access Control
# Virtual sandbox allows simulation nodes to publish telemetry
allow_anonymous true

# Maximum packet size (2MB) for wave telemetry bursts
max_packet_size 2097152
max_connections 1000

