# ==============================================================================
# AQUA CREW — Production Docker Compose Orchestration
# Services: PostgreSQL (with PostGIS), FastAPI Core Backend, Next.js Web Frontend
# ==============================================================================
version: '3.8'

services:
  # ----------------------------------------------------------------------------
  # 1. PostgreSQL Database with PostGIS Geospatial Extensions
  # ----------------------------------------------------------------------------
  postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: aqua_crew_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aqua_crew}
      POSTGRES_USER: ${POSTGRES_USER:-aqua_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-super_secure_postgres_pass_2026}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aqua_admin} -d ${POSTGRES_DB:-aqua_crew}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M
        reservations:
          cpus: '0.5'
          memory: 512M

  # ----------------------------------------------------------------------------
  # 2. FastAPI Core Backend Service
  # ----------------------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: aqua_crew_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      AQUA_API_ENV: ${AQUA_API_ENV:-production}
      AQUA_API_HOST: 0.0.0.0
      AQUA_API_PORT: 8000
      AQUA_DATABASE_URL: postgresql://${POSTGRES_USER:-aqua_admin}:${POSTGRES_PASSWORD:-super_secure_postgres_pass_2026}@postgres:5432/${POSTGRES_DB:-aqua_crew}
      AQUA_JWT_SECRET_KEY: ${AQUA_JWT_SECRET_KEY:-prod-secret-minimum-32-chars-long-random-string}
      AQUA_REQUIRE_AUTH: "true"
      AQUA_CORS_ORIGINS: "[\"http://localhost:3000\",\"http://127.0.0.1:3000\"]"
      AQUA_LOG_FORMAT: "json"
      AQUA_RATE_LIMIT_ENABLED: "true"
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health/liveness"]
      interval: 15s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M
        reservations:
          cpus: '0.5'
          memory: 512M

  # ----------------------------------------------------------------------------
  # 3. Next.js Web Frontend Service
  # ----------------------------------------------------------------------------
  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    container_name: aqua_crew_web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
      NEXT_PUBLIC_WS_URL: ws://localhost:8000/ws
    ports:
      - "3000:3000"
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1536M
        reservations:
          cpus: '0.25'
          memory: 256M

  # ----------------------------------------------------------------------------
  # 4. Eclipse Mosquitto MQTT Telemetry Broker
  # ----------------------------------------------------------------------------
  mosquitto:
    image: eclipse-mosquitto:2.0-alpine
    container_name: aqua_crew_mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./docker/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquittodata:/mosquitto/data
      - mosquittolog:/mosquitto/log
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -t '$$SYS/#' -C 1 -i healthcheck -u '' || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 64M

  # ----------------------------------------------------------------------------
  # 5. Nginx Reverse Proxy & Unified HTTP Gateway
  # ----------------------------------------------------------------------------
  gateway:
    image: nginx:1.25-alpine
    container_name: aqua_crew_gateway
    restart: unless-stopped
    depends_on:
      - api
      - web
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost/ > /dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M

volumes:
  pgdata:
    driver: local
  mosquittodata:
    driver: local
  mosquittolog:
    driver: local

